<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Open DBOPFS Studio</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <main>
    <header class="brand">
      <img src="../assets/icons/mark.svg" width="52" height="52" alt="">
      <div><strong>DBOPFS</strong><span>Studio</span></div>
    </header>
    <section class="site-card" aria-labelledby="site-title">
      <p class="eyebrow">Inspected origin</p>
      <h1 id="site-title">Checking this page…</h1>
      <p id="site-status" aria-live="polite">Open Studio in a dedicated window connected to this DevTools target.</p>
    </section>
    <button id="open-studio-window" type="button">Open Studio window <span aria-hidden="true">↗</span></button>
    <p class="privacy">The Studio window stays connected to this tab’s origin-private storage. Your data remains in this browser.</p>
  </main>
  <script type="module" src="panel.js"></script>
</body>
</html>
