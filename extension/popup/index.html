<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>DBOPFS Studio</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header class="brand">
      <img src="../assets/icons/mark.svg" width="42" height="42" alt="">
      <div><strong>DBOPFS</strong><span>Studio</span></div>
    </header>
    <section class="site-card" aria-labelledby="site-title">
      <p class="eyebrow">Current origin</p>
      <h1 id="site-title">Checking this tab…</h1>
      <p id="site-status">DBOPFS Studio connects locally to this page’s origin-private storage.</p>
    </section>
    <button id="open-studio" type="button">Open Studio <span aria-hidden="true">→</span></button>
    <p class="privacy">Your data remains in this browser. DBOPFS Studio does not transmit site storage.</p>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
