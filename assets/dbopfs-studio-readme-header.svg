<svg xmlns="http://www.w3.org/2000/svg" width="2172" height="724" viewBox="0 0 2172 724" role="img" aria-labelledby="title description">
  <title id="title">DBOPFS Studio</title>
  <desc id="description">A DBOPFS-powered workspace for making browser data legible in Chromium browsers.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030811"/>
      <stop offset="0.52" stop-color="#050c17"/>
      <stop offset="1" stop-color="#0d1220"/>
    </linearGradient>
    <linearGradient id="gold-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d7a84d" stop-opacity="0"/>
      <stop offset="0.28" stop-color="#d7a84d"/>
      <stop offset="1" stop-color="#d7a84d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="database-teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d6b65" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#0d6b65" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="database-plum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c3358" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#4c3358" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="violet-core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f4ecd7"/>
      <stop offset="0.24" stop-color="#ab94ff"/>
      <stop offset="1" stop-color="#ab94ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="teal-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4abeb2" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#4abeb2" stop-opacity="0"/>
    </radialGradient>
    <filter id="window-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="core-glow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#aeb8cc" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="window-clip">
      <rect x="1115" y="86" width="934" height="552" rx="24"/>
    </clipPath>
  </defs>

  <rect width="2172" height="724" fill="url(#background)"/>
  <rect width="2172" height="724" fill="url(#grid)"/>
  <circle cx="1820" cy="110" r="340" fill="url(#teal-halo)"/>
  <path d="M-80 635C355 512 667 585 1051 726" fill="none" stroke="#4c3358" stroke-opacity="0.18" stroke-width="2"/>
  <path d="M1235 70C1571 -37 1942 27 2245 245" fill="none" stroke="#d7a84d" stroke-opacity="0.25" stroke-width="2"/>
  <path d="M1325 26C1620 -46 1917 20 2179 191" fill="none" stroke="#4abeb2" stroke-opacity="0.15" stroke-width="1.5"/>

  <g fill="#edf1fa">
    <circle cx="94" cy="96" r="2" opacity="0.75"/>
    <circle cx="252" cy="57" r="1.5" opacity="0.5"/>
    <circle cx="475" cy="114" r="1.8" opacity="0.7"/>
    <circle cx="705" cy="58" r="1.4" opacity="0.45"/>
    <circle cx="909" cy="133" r="2.2" opacity="0.55"/>
    <circle cx="1037" cy="44" r="1.4" opacity="0.65"/>
    <circle cx="2091" cy="77" r="1.8" opacity="0.7"/>
    <circle cx="2131" cy="539" r="1.5" opacity="0.6"/>
    <circle cx="982" cy="651" r="2" opacity="0.45"/>
    <circle cx="498" cy="666" r="1.5" opacity="0.55"/>
    <circle cx="145" cy="611" r="1.8" opacity="0.6"/>
  </g>
  <g fill="#d7a84d">
    <circle cx="345" cy="97" r="2.2" opacity="0.8"/>
    <circle cx="778" cy="99" r="1.8" opacity="0.75"/>
    <circle cx="2068" cy="202" r="2.4" opacity="0.8"/>
    <circle cx="1066" cy="606" r="2" opacity="0.65"/>
  </g>

  <g aria-label="DBOPFS Studio identity">
    <text x="120" y="145" fill="#d7a84d" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="6">DBOPFS-POWERED CHROMIUM WORKSPACE</text>
    <text x="112" y="340" fill="#f4ecd7" font-family="Georgia, Times New Roman, serif" font-size="176" letter-spacing="-7">DBOPFS</text>
    <text x="124" y="431" fill="#d7a84d" font-family="Segoe UI, Arial, sans-serif" font-size="74" font-weight="300" letter-spacing="24">STUDIO</text>
    <rect x="120" y="474" width="820" height="2" fill="url(#gold-line)"/>
    <text x="120" y="536" fill="#edf1fa" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="400">Your browser data, made legible.</text>
    <text x="120" y="590" fill="#aeb8cc" font-family="Segoe UI, Arial, sans-serif" font-size="24">Explore. Edit. Preview. Print. Keep control.</text>
    <text x="120" y="655" fill="#d7a84d" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="7">THE WIZARD NEXUS</text>
  </g>

  <g filter="url(#window-shadow)" aria-label="DBOPFS Studio workspace preview">
    <rect x="1115" y="86" width="934" height="552" rx="24" fill="#030811" stroke="#3b455e" stroke-width="2"/>
    <g clip-path="url(#window-clip)">
      <rect x="1115" y="86" width="934" height="72" fill="#151c2d"/>
      <circle cx="1152" cy="122" r="7" fill="#f08080"/>
      <circle cx="1178" cy="122" r="7" fill="#e9b85f"/>
      <circle cx="1204" cy="122" r="7" fill="#61c990"/>
      <text x="1260" y="130" fill="#edf1fa" font-family="Georgia, Times New Roman, serif" font-size="26">DBOPFS Studio</text>
      <text x="1930" y="127" fill="#aeb8cc" font-family="Consolas, monospace" font-size="16" text-anchor="end">app.example</text>

      <rect x="1115" y="158" width="64" height="480" fill="#0d1220"/>
      <rect x="1179" y="158" width="260" height="480" fill="#050c17" stroke="#3b455e" stroke-width="1"/>
      <rect x="1189" y="211" width="240" height="42" rx="8" fill="#0d6b65" fill-opacity="0.28"/>
      <text x="1199" y="193" fill="#d7a84d" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">ORIGIN STORAGE</text>
      <text x="1208" y="238" fill="#edf1fa" font-family="Consolas, monospace" font-size="17">apps</text>
      <text x="1230" y="289" fill="#aeb8cc" font-family="Consolas, monospace" font-size="16">field-notes</text>
      <rect x="1208" y="309" width="211" height="42" rx="7" fill="#0d6b65" fill-opacity="0.34"/>
      <circle cx="1230" cy="330" r="5" fill="none" stroke="#d7a84d" stroke-width="2" transform="rotate(45 1230 330)"/>
      <text x="1248" y="336" fill="#edf1fa" font-family="Consolas, monospace" font-size="16">records</text>
      <text x="1230" y="391" fill="#aeb8cc" font-family="Consolas, monospace" font-size="16">attachments</text>
      <text x="1208" y="451" fill="#aeb8cc" font-family="Consolas, monospace" font-size="16">photo-catalog</text>

      <rect x="1439" y="158" width="610" height="480" fill="#030811"/>
      <text x="1474" y="200" fill="#aeb8cc" font-family="Consolas, monospace" font-size="16">apps / field-notes / records</text>
      <rect x="1909" y="176" width="105" height="32" rx="16" fill="#0d6b65" fill-opacity="0.35" stroke="#4abeb2" stroke-opacity="0.65"/>
      <text x="1962" y="198" fill="#61c990" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">CONNECTED</text>

      <g>
        <rect x="1474" y="231" width="155" height="82" rx="10" fill="#0d1220" stroke="#3b455e"/>
        <text x="1491" y="257" fill="#aeb8cc" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">TABLES</text>
        <text x="1491" y="294" fill="#f4ecd7" font-family="Georgia, serif" font-size="30">06</text>
        <rect x="1643" y="231" width="155" height="82" rx="10" fill="#0d1220" stroke="#3b455e"/>
        <text x="1660" y="257" fill="#aeb8cc" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">RECORDS</text>
        <text x="1660" y="294" fill="#f4ecd7" font-family="Georgia, serif" font-size="30">248</text>
        <rect x="1812" y="231" width="202" height="82" rx="10" fill="#0d1220" stroke="#3b455e"/>
        <text x="1829" y="257" fill="#aeb8cc" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">STORAGE</text>
        <text x="1829" y="294" fill="#f4ecd7" font-family="Georgia, serif" font-size="30">18 MB</text>
      </g>

      <rect x="1474" y="335" width="540" height="270" rx="12" fill="#050c17" stroke="#3b455e"/>
      <rect x="1474" y="335" width="540" height="52" rx="12" fill="#0d1220"/>
      <path d="M1474 387H2014" stroke="#3b455e"/>
      <text x="1494" y="367" fill="#edf1fa" font-family="Consolas, monospace" font-size="15">observation-0248.json</text>
      <g font-family="Consolas, monospace" font-size="16">
        <text x="1498" y="426" fill="#ab94ff">{</text>
        <text x="1518" y="458" fill="#edf1fa">"title":</text><text x="1600" y="458" fill="#4abeb2">"Summer survey"</text><text x="1745" y="458" fill="#edf1fa">,</text>
        <text x="1518" y="490" fill="#edf1fa">"status":</text><text x="1610" y="490" fill="#4abeb2">"reviewed"</text><text x="1725" y="490" fill="#edf1fa">,</text>
        <text x="1518" y="522" fill="#edf1fa">"attachments":</text><text x="1660" y="522" fill="#e9b85f">3</text><text x="1673" y="522" fill="#edf1fa">,</text>
        <text x="1518" y="554" fill="#edf1fa">"local":</text><text x="1598" y="554" fill="#61c990">true</text>
        <text x="1498" y="586" fill="#ab94ff">}</text>
      </g>
    </g>
  </g>

  <g transform="translate(1076 105) scale(0.68)" opacity="0.85" aria-hidden="true">
    <ellipse cx="64" cy="42" rx="37" ry="13" fill="url(#database-teal)" stroke="#d7a84d" stroke-width="3"/>
    <path d="M27 42v19c0 7 17 13 37 13s37-6 37-13V42" fill="url(#database-teal)" stroke="#d7a84d" stroke-width="3"/>
    <path d="M27 61v19c0 7 17 13 37 13s37-6 37-13V61" fill="url(#database-plum)" stroke="#d7a84d" stroke-width="3"/>
    <ellipse cx="64" cy="80" rx="37" ry="13" fill="url(#database-plum)" stroke="#d7a84d" stroke-width="3"/>
    <ellipse cx="64" cy="63" rx="53" ry="25" fill="none" stroke="#4abeb2" stroke-width="2" transform="rotate(-24 64 63)"/>
    <circle cx="16" cy="81" r="5" fill="#4abeb2"/>
    <circle cx="112" cy="44" r="5" fill="#d7a84d"/>
    <circle cx="64" cy="55" r="14" fill="url(#violet-core)" filter="url(#core-glow)"/>
    <circle cx="64" cy="55" r="4" fill="#f4ecd7"/>
  </g>
</svg>
